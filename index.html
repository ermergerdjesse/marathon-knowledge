<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marathon Knowledge Base</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.basic.min.js"></script>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="top-nav">
    <div class="nav-brand" id="brandHome" title="Return to Search">
      <span class="brand-title">Marathon KB</span>
      <span class="badge">V0.1</span>
    </div>
  </header>

  <main class="app-container">
    <!-- Home / Search View -->
    <section id="searchHomeView" class="view-active">
      <div class="search-hero">
        <h1>Production Knowledge Base</h1>
        <p>Search workflows, press quirks, SiteFlow formulas, and bindery troubleshooting.</p>
        
        <div class="search-box-wrapper">
          <input type="text" id="searchInput" placeholder="Type a symptom, machine, or error (e.g. BQ-500, HP 120K, auto-send)..." autocomplete="off" autofocus />
        </div>

        <div class="category-filter-wrapper">
          <span class="filter-label">Filter Category:</span>
          <div class="category-pills" id="categoryPills">
            <button class="pill active" data-cat="all">All</button>
            <button class="pill" data-cat="SiteFlow">SiteFlow</button>
            <button class="pill" data-cat="Press">Presses</button>
            <button class="pill" data-cat="Prepress">Prepress / Impostrip</button>
            <button class="pill" data-cat="Bindery">Bindery</button>
          </div>
        </div>
      </div>

      <!-- Live Search Results Grid -->
      <div class="results-container">
        <div class="results-header" id="resultsCount">All Documentation</div>
        <div class="results-grid" id="resultsGrid">
          <!-- Article cards injected by app.js -->
        </div>
      </div>
    </section>

    <!-- Reading / Article View -->
    <section id="articleReaderView" class="view-hidden">
      <button class="back-btn" id="backToSearchBtn">← Back to Search</button>
      
      <div class="reader-meta" id="readerMeta">
        <span id="articleCategoryTag" class="tag"></span>
        <span id="articleDateTag" class="date-text"></span>
      </div>

      <article id="articleMarkdownContent" class="markdown-body">
        <!-- Rendered markdown injected here -->
      </article>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
